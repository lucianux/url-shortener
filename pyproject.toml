[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "url-shortener-backend"
version = "0.1.0"
description = "Un acortador de URLs minimalista con FastAPI"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn>=0.28.0",
    "pydantic>=2.6.4"
]

[tool.hatch.build.targets.wheel]
include = [
  "main.py",
]